<div class="custom-slider-container">
  <div class="custom-slider">
    {{ $images := .Get 0 }}
    {{ range split $images "," }}
      <div class="slider-item">
        <img src="{{ . | safeURL }}" alt="Slider Image">
      </div>
    {{ end }}
  </div>
</div>

<style>
.custom-slider-container {
  width: 100%;
  max-width: 850px; /* 稍微加宽一点，配合你的宽屏截图 */
  margin: 0 auto 1.5rem;
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  background-color: #0b111e; /* 使用和你截图一致的暗色背景，让局部图完美融入 */
}

.custom-slider {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.custom-slider::-webkit-scrollbar {
  display: none;
}
.custom-slider {
  -ms-overflow-style: none;  
  scrollbar-width: none;  
}

/* 每一个滑动页面的容器 */
.slider-item {
  flex: 0 0 100%;
  width: 100%;
  height: 500px; /* 统一滑块整体高度 */
  display: flex;
  align-items: center;
  justify-content: center;
  scroll-snap-align: start;
}

/* 核心修复：等比例完整显示图片 */
.slider-item img {
  margin: 0 !important;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain; /* 保证图片不被裁剪、完整显示 */
}
</style>
